steps:
  # Build the container image using the backend folder as context
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/pillcare-backend:latest', './backend']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/pillcare-backend:latest']
images:
  - 'gcr.io/$PROJECT_ID/pillcare-backend:latest'
